[package]
name = "audio-to-text"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "audio-to-text"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.21"

[profile.release]
opt-level = 3
lto = true
